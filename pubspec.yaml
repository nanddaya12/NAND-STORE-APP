name: nand_store
description: "NAND Store - A premium e-commerce platform for electronics, fashion, and lifestyle products."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  google_fonts: ^6.2.1
  intl: ^0.19.0
  speech_to_text: ^7.4.0
  image_picker: ^1.1.2
  
  # Clean Architecture Packages
  dio: ^5.4.0
  json_annotation: ^4.8.1
  connectivity_plus: ^5.0.2
  internet_connection_checker_plus: ^2.2.0
  flutter_secure_storage: ^9.0.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.1
  equatable: ^2.0.5
  
  # Database Architecture Packages
  shared_preferences: ^2.2.2
  encrypt: ^5.0.3
  crypto: ^3.0.3

  # AR Shopping Packages
  sensors_plus: ^4.0.0
  vector_math: ^2.1.4
  permission_handler: ^11.3.0

  # Security Architecture Packages
  jwt_decoder: ^2.0.1
  device_info_plus: ^9.1.2
  package_info_plus: ^8.0.0
  pointycastle: ^3.9.1
  local_auth: ^2.1.2
  geolocator: ^14.0.2
  geocoding: ^4.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  
  # Code generators
  build_runner: ^2.4.8
  json_serializable: ^6.7.1
  hive_generator: ^2.0.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
  fonts:
    - family: HankenGrotesk
      fonts:
        - asset: assets/fonts/HankenGrotesk-Regular.ttf
